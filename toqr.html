<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TO QR Code</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

    :root {
      --bg: #f4f3ee;
      --primary: #06ffa5;
      --dark: #1a1a1a;
      --border: 3px solid var(--dark);
      --shadow: 6px 6px 0px 0px var(--dark);
      --shadow-sm: 3px 3px 0px 0px var(--dark);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Mono', monospace;
      background-color: var(--bg);
      color: var(--dark);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .neo-box {
      background: #fff;
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 24px;
    }

    .neo-btn {
      background: var(--primary);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 12px 24px;
      font-family: inherit;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      margin-top: 10px;
      transition: 0.1s;
    }

    .neo-btn:active {
      box-shadow: none;
      transform: translate(3px, 3px);
    }

    .neo-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: 3px 3px 0 var(--dark);
    }

    .neo-btn.download {
      background: #ffe66d;
    }

    .neo-input {
      border: var(--border);
      padding: 12px;
      font-family: inherit;
      font-size: 16px;
      width: 100%;
      margin-bottom: 12px;
      outline: none;
    }

    .neo-input:focus {
      background: #b8f5d8;
    }

    .captcha-box {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }

    .neo-link {
      display: block;
      background: #ff6b6b;
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      text-decoration: none;
      color: var(--dark);
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      transition: 0.1s;
    }

    .neo-link:hover {
      box-shadow: none;
      transform: translate(3px, 3px);
    }

    .result-img {
      max-width: 100%;
      border: var(--border);
      box-shadow: var(--shadow-sm);
      margin-top: 16px;
      display: none;
      background: #fff;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="neo-box">

      <h2 style="margin-top:0; background:var(--primary); display:inline-block; padding:4px 10px;">
        <i class="fa-solid fa-qrcode"></i> TO QR CODE
      </h2>

      <input
        type="text"
        id="input1"
        class="neo-input"
        placeholder="Masukkan Link kamu"
      >

      <!-- CLOUDFLARE TURNSTILE -->
      <div class="captcha-box">
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAEn8FrBprhf2NZdx"
          data-callback="captchaSuccess"
          data-expired-callback="captchaExpired"
          data-error-callback="captchaError">
        </div>
      </div>

      <button
        class="neo-btn"
        id="generateBtn"
        onclick="generate()"
        disabled>
        GENERATE QR
      </button>

      <img
        id="result"
        class="result-img"
        alt="QR Code"
      >

      <button
        class="neo-btn download"
        id="downloadBtn"
        style="display:none;"
        onclick="downloadFile()">
        ⬇ DOWNLOAD QR
      </button>

    </div>

    <a href="index.html" class="neo-link">
      &larr; KEMBALI KE MENU
    </a>

  </div>


  <script>

    let currentUrl = '';
    let captchaToken = null;

    // CAPTCHA BERHASIL
    function captchaSuccess(token) {

      captchaToken = token;

      document.getElementById('generateBtn').disabled = false;

    }


    // CAPTCHA EXPIRED
    function captchaExpired() {

      captchaToken = null;

      document.getElementById('generateBtn').disabled = true;

    }


    // CAPTCHA ERROR
    function captchaError() {

      captchaToken = null;

      document.getElementById('generateBtn').disabled = true;

    }


    function generate() {

      // Pastikan CAPTCHA sudah selesai
      if (!captchaToken) {
        return alert('Silakan selesaikan CAPTCHA terlebih dahulu!');
      }

      const val = document
        .getElementById('input1')
        .value
        .trim();

      if (!val) {
        return alert('Isi kolom terlebih dahulu!');
      }


      currentUrl =
        `https://api.nexadev.my.id/tools/toqr?url=${encodeURIComponent(val)}`;


      const img = document.getElementById('result');

      img.src = currentUrl;

      img.onload = () => {

        document.getElementById('downloadBtn')
          .style.display = 'block';

      };

      img.style.display = 'block';

    }


    function downloadFile() {

      fetch(currentUrl)
        .then(r => r.blob())
        .then(blob => {

          const a = document.createElement('a');

          a.href = URL.createObjectURL(blob);

          a.download = 'qrcode.png';

          document.body.appendChild(a);

          a.click();

          document.body.removeChild(a);

        });

    }

  </script>

</body>
</html>
