<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bratvid Viral</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Cloudflare Turnstile -->
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer>
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

    :root {
      --bg: #f4f3ee;
      --primary: #9b5de5;
      --dark: #1a1a1a;
      --border: 3px solid var(--dark);
      --shadow: 6px 6px 0px 0px var(--dark);
      --shadow-sm: 3px 3px 0px 0px var(--dark);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Mono', monospace;
      background-color: var(--bg);
      color: var(--dark);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .neo-box {
      background: #fff;
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 24px;
    }

    .neo-btn {
      background: var(--primary);
      color: white;
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 12px 24px;
      font-family: inherit;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
      width: 100%;
      margin-top: 10px;
      transition: 0.1s;
    }

    .neo-btn:active:not(:disabled) {
      box-shadow: none;
      transform: translate(3px, 3px);
    }

    .neo-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: 3px 3px 0 var(--dark);
    }

    .neo-btn.download {
      background: #ffe66d;
      color: #000;
    }

    .neo-input {
      border: var(--border);
      padding: 12px;
      font-family: inherit;
      font-size: 16px;
      width: 100%;
      margin-bottom: 12px;
      outline: none;
    }

    .neo-input:focus {
      background: #e0cffc;
    }

    .captcha-box {
      margin: 15px 0;
      display: flex;
      justify-content: center;
      min-height: 65px;
    }

    .neo-link {
      display: block;
      background: #ff6b6b;
      border: var(--border);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      text-decoration: none;
      color: var(--dark);
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
      transition: 0.1s;
    }

    .neo-link:hover {
      box-shadow: none;
      transform: translate(3px, 3px);
    }

    .result-video {
      width: 100%;
      border: var(--border);
      box-shadow: var(--shadow-sm);
      margin-top: 16px;
      display: none;
      background: #000;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border: var(--border);
      background: #fff;
      text-align: center;
      font-weight: 700;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="neo-box">

      <h2 style="margin-top:0; background:var(--primary); color:#fff; display:inline-block; padding:4px 10px;">
        <i class="fa-solid fa-film"></i> BRATVID VIRAL
      </h2>

      <input
        type="text"
        id="input1"
        class="neo-input"
        placeholder="Masukkan teks video..."
      >

      <!-- CLOUDFLARE TURNSTILE -->
      <div class="captcha-box">
        <div
          class="cf-turnstile"
          data-sitekey="1x00000000000000000000AA"
          data-callback="captchaSuccess"
          data-expired-callback="captchaExpired"
          data-error-callback="captchaError">
        </div>
      </div>

      <!-- GENERATE BUTTON -->
      <button
        class="neo-btn"
        id="generateBtn"
        onclick="generate()"
        disabled>
        GENERATE VIDEO
      </button>

      <div
        id="status"
        class="status">
      </div>

      <video
        id="result"
        class="result-video"
        controls>
      </video>

      <button
        class="neo-btn download"
        id="downloadBtn"
        style="display:none;"
        onclick="downloadFile()">
        ⬇ DOWNLOAD VIDEO
      </button>

    </div>

    <a href="index.html" class="neo-link">
      &larr; KEMBALI KE MENU
    </a>

  </div>


  <script>

    let currentUrl = '';
    let captchaToken = null;


    // =========================
    // CAPTCHA BERHASIL
    // =========================
    function captchaSuccess(token) {

      captchaToken = token;

      const btn = document.getElementById('generateBtn');

      btn.disabled = false;
    }


    // =========================
    // CAPTCHA EXPIRED
    // =========================
    function captchaExpired() {

      captchaToken = null;

      const btn = document.getElementById('generateBtn');

      btn.disabled = true;
    }


    // =========================
    // CAPTCHA ERROR
    // =========================
    function captchaError() {

      captchaToken = null;

      const btn = document.getElementById('generateBtn');

      btn.disabled = true;
    }


    // =========================
    // GENERATE VIDEO
    // =========================
    function generate() {

      // CAPTCHA wajib
      if (!captchaToken) {
        alert('Silakan selesaikan CAPTCHA terlebih dahulu!');
        return;
      }

      const input = document.getElementById('input1');
      const video = document.getElementById('result');
      const status = document.getElementById('status');
      const downloadBtn = document.getElementById('downloadBtn');

      const val = input.value.trim();

      // Input kosong
      if (!val) {
        alert('Isi kolom terlebih dahulu!');
        return;
      }


      // URL API
      currentUrl =
        `https://apii.nexadev.my.id/bratvid2?text=${encodeURIComponent(val)}`;


      // Reset tampilan
      video.style.display = 'none';
      downloadBtn.style.display = 'none';

      status.style.display = 'block';
      status.innerText =
        '⏳ Generating video, mohon tunggu...';

      status.style.background = '#ffe66d';


      // Load video
      video.src = currentUrl;


      video.onloadeddata = function() {

        video.style.display = 'block';

        downloadBtn.style.display = 'block';

        status.innerText =
          '✅ Video siap diputar dan diunduh!';

        status.style.background = '#4ecdc4';
      };


      video.onerror = function() {

        status.innerText =
          '❌ Gagal memuat video.';

        status.style.background = '#ff6b6b';
      };

    }


    // =========================
    // DOWNLOAD VIDEO
    // =========================
    function downloadFile() {

      if (!currentUrl) {
        alert('Belum ada video!');
        return;
      }

      const status = document.getElementById('status');

      status.style.display = 'block';

      status.innerText =
        '⏳ Mengunduh video...';

      status.style.background = '#ffe66d';


      fetch(currentUrl)

        .then(response => {

          if (!response.ok) {
            throw new Error('Download gagal');
          }

          return response.blob();

        })

        .then(blob => {

          const url =
            URL.createObjectURL(blob);

          const a =
            document.createElement('a');

          a.href = url;

          a.download =
            'bratvid.mp4';

          document.body.appendChild(a);

          a.click();

          document.body.removeChild(a);

          URL.revokeObjectURL(url);

          status.innerText =
            '✅ Download selesai!';

          status.style.background =
            '#4ecdc4';

        })

        .catch(error => {

          console.error(error);

          status.innerText =
            '❌ Gagal mengunduh video.';

          status.style.background =
            '#ff6b6b';

        });

    }

  </script>

</body>
</html>
